# ============================================================
#  CONFIGURACIÓN — Monitor Santander v2
#  Aquí se cambian temas, palabras y cuentas SIN tocar el código.
#  Las tildes y mayúsculas dan igual (se normalizan solas).
# ============================================================

zona_horaria: Europe/Madrid
horas_resumen: [9, 14, 21]       # a estas horas te llega el resumen por Telegram
max_alertas_por_pasada: 10       # el resto de alertas va al resumen (evita avalanchas)
max_por_tema_en_resumen: 12

informe_semanal:                 # te llega un Word por Telegram (también con /semanal)
  activo: true
  dia: 4                         # 0=lunes ... 4=viernes ... 6=domingo
  hora: 20
  dias: 7                        # días que abarca el informe
antiguedad_max_horas: 36         # ignora noticias más viejas que esto

# Noticias NACIONALES de prioridad alta: solo avisan al momento si son de estos temas
# (el resto de lo nacional va al resumen, para no llenarte el móvil).
alertas_nacionales: [huelgas, movilidad, emergencias, eta_borroka]

# ---------- ZONA ----------
# Una noticia "local" debe mencionar alguna de estas palabras.
zona:
  - santander
  - cantabria
  - cantabr            # cántabro, cántabra...
  - torrelavega
  - castro urdiales
  - laredo
  - astillero
  - camargo
  - maliano
  - muriedas
  - pielagos
  - santona
  - reinosa
  - suances
  - comillas
  - colindres
  - noja
  - liebana
  - potes
  - san vicente de la barquera
  - sardinero
  - penacastillo
  - parayas
  - seve ballesteros

# Si aparece alguno de estos y NO aparece ninguna otra palabra de zona
# (aparte de "santander"), se descarta: evita Banco Santander, Colombia...
excluir:
  - banco santander
  - grupo santander
  - santander consumer
  - santander bank
  - santander uk
  - santander brasil
  - santander mexico
  - ana botin
  - openbank
  - colombia
  - bucaramanga
  - cucuta
  - norte de santander

# ---------- TEMAS ----------
# prioridad alta  -> aviso inmediato por Telegram
# prioridad media/baja -> va al resumen
# Las palabras funcionan como "empieza por": "concentra" pilla concentración, concentramos...
# Con ! al final es palabra exacta: "ere!" pilla ERE pero no "eres".
temas:
  orden_publico:
    prioridad: alta
    palabras: [disturbio, altercado, carga policial, cargas policiales, cargo contra, enfrentamiento, incidentes, contramanifesta, barricada, pelea multitudinaria, detenidos tras]
  extremismo:
    prioridad: alta
    palabras: [extrema derecha, ultraderecha, ultraderechista, neonazi, nazi, fascis, falange, falangista, hogar social, democracia nacional, skinhead, simbologia nazi, extrema izquierda, ultraizquierda, antifascis, antifa, anarquis, delito de odio, delitos de odio]
  eta_borroka:
    prioridad: alta
    palabras: [eta!, kale borroka, borroka, ongi etorri, presos de eta, expresos de eta, dispersion de presos, enaltecimiento del terrorismo, apologia del terrorismo, sabotaje, ataque a la sede, ataque contra la sede, pintadas amenazantes, artefacto, cocteles molotov, coctel molotov, quema de cajeros, contenedores quemados, segi!, jarrai, haika, gks!, gazte koordinadora]
  protestas:
    prioridad: alta
    palabras: [concentra, manifesta, protesta, convoca, moviliza, cacerolada, acampa, piquete, encierro, marcha por, sentada]
  sindicatos:
    prioridad: media
    palabras: [ccoo, comisiones obreras, ugt, union general de trabajadores, cgt, cnt, csif, sindicato uso, sindicato de vivienda, sindicato de inquilinas, sindicato de estudiantes, comite de empresa, convenio colectivo, delegados sindicales, expediente de regulacion, ere!]
  huelgas:
    prioridad: alta
    palabras: [huelga, servicios minimos, paro general, paros parciales]
  emergencias:
    prioridad: alta
    palabras: [incendio, explosion, evacua, desaloj, inundacion, temporal, aviso naranja, aviso rojo, alerta naranja, alerta roja, "112", rescate, derrumbe, fuga de gas, herido, fallecid]
  movilidad:
    prioridad: alta
    palabras: [corte de trafico, cortes de trafico, cortad, carretera cortada, desvio, retenciones, atasco, accidente de trafico, colision, salida de via, vuelos cancelados, trenes cancelados, sin trenes, suspendido el servicio, servicio suspendido, servicios minimos]
  servicios:
    prioridad: media
    palabras: [corte de agua, corte de luz, apagon, sin suministro, averia]
  politica:
    prioridad: media
    palabras: [pp!, elecciones, mitin, campana electoral, candidat, pleno, junta electoral, encuesta, votacion, debate electoral, partido popular, populares, psoe, socialistas, vox, prc, partido regionalista, revilla, buruaga, podemos, sumar, izquierda unida, eh bildu, bildu, sortu, ernai, abertzale, pnv, parlamento de cantabria, gobierno de cantabria, gema igual]
  vivienda:
    prioridad: media
    palabras: [desahucio, vivienda, alquiler, fondo buitre, fondos buitre, sindicato de vivienda, okupa]
  sucesos:
    prioridad: media
    palabras: [detenid, agresion, robo, operacion policial, guardia civil, policia nacional, policia local]
  eventos:
    prioridad: baja
    palabras: [concierto, festival, feria, racing, fiesta, exposicion, maraton, procesion]

# ---------- FUENTES (todas gratuitas) ----------
fuentes:
  google_news:
    ventana: 1d
    locales:          # deben mencionar la zona
      - 'Santander -"Banco Santander" -Botín -Colombia -Bucaramanga'
      - 'Cantabria'
      - '(concentración OR manifestación OR protesta OR huelga OR convocatoria) (Santander OR Cantabria)'
      - '(incendio OR accidente OR corte OR cortada OR evacuación OR temporal) (Santander OR Cantabria)'
      - '(elecciones OR mitin OR candidato OR candidata OR encuesta) Cantabria'
      - '(CCOO OR UGT OR "Comisiones Obreras" OR CGT OR CNT OR CSIF) (Santander OR Cantabria)'
      - '("extrema derecha" OR ultraderecha OR neonazi OR falange OR "extrema izquierda" OR antifascista OR antifa) (Santander OR Cantabria)'
      - '(Vox OR PRC OR "Partido Regionalista" OR PSOE OR "Partido Popular" OR Podemos OR Sumar OR "Izquierda Unida") Cantabria (mitin OR acto OR campaña OR concentración)'
      - '(disturbios OR altercados OR "cargas policiales" OR enfrentamientos) (Santander OR Cantabria)'
      - '(ETA OR "kale borroka" OR borroka OR abertzale OR "ongi etorri" OR "enaltecimiento del terrorismo") (Santander OR Cantabria)'
      - 'site:elfaradio.com'
      - 'site:eldiariomontanes.es'
      - 'site:ifomo.es'
    nacionales:       # no hace falta que mencionen Santander, pero deben encajar en un tema
      - '"huelga general"'
      - '"elecciones generales" ("29 de noviembre" OR 29N)'
      - 'huelga (Renfe OR Adif OR ALSA OR transportistas OR "controladores aéreos" OR Aena)'
      - '(aviso OR alerta) AEMET (Cantábrico OR Cantabria)'
      - '(CCOO OR UGT) (huelga OR movilización OR manifestación OR "huelga general")'
      - '("kale borroka" OR borroka OR sabotaje OR "ongi etorri" OR "cócteles molotov" OR "enaltecimiento del terrorismo") (Euskadi OR "País Vasco" OR Bilbao OR Donostia OR "San Sebastián" OR Vitoria OR Navarra OR Pamplona)'
      - '(ETA OR "presos de ETA") (homenaje OR "ongi etorri" OR atentado OR aniversario OR víctimas)'

  rss_medios:         # RSS propio de medios locales
    - https://www.elfaradio.com/feed/

  gdelt:              # base de datos mundial de noticias, se actualiza cada 15 min
    - '(Santander OR Cantabria) sourcelang:spanish'

  reddit:             # subreddits
    - cantabria

  mastodon_hashtags:  # servidor/hashtag
    - mastodon.social/santander
    - mastodon.social/cantabria

  bluesky_busquedas:  # necesita secrets BSKY_HANDLE y BSKY_APP_PASSWORD (si no, se salta)
    - Santander
    - Cantabria

  bluesky_cuentas: [] # handles, p.ej.:  - algo.bsky.social

  telegram_canales: [] # canales PÚBLICOS: de t.me/NOMBRE pon solo NOMBRE

  instagram:          # necesita secrets IG_USER_ID y META_TOKEN (si no, se salta)
    intervalo_min: 30
    token_caduca: ""  # fecha AAAA-MM-DD en que caduca el token de Meta -> te avisa 7 días antes
    cuentas:
      - sindicatoviviendacantabria
